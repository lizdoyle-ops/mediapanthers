<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer 360</title>
  <script src="https://unpkg.com/@frontapp/plugin-sdk/dist/index.umd.js"></script>
  <style>
    :root {
      --color-bg: #ffffff;
      --color-surface: #f7f8fa;
      --color-border: #e5e7eb;
      --color-text: #111827;
      --color-text-muted: #6b7280;
      --color-primary: #0066ff;
      --color-success: #16a34a;
      --color-success-bg: #f0fdf4;
      --color-danger: #dc2626;
      --color-danger-bg: #fef2f2;
      --color-warning: #d97706;
      --color-warning-bg: #fffbeb;
      --color-gold: #b45309;
      --color-gold-bg: #fef3c7;
      --radius: 8px;
      --radius-sm: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: var(--color-text);
      background: var(--color-bg);
      padding: 12px;
      line-height: 1.5;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .btn-send-email {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }
    .btn-send-email:hover { background: #0052cc; }
    .btn-send-email:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Tabs ── */
    .tab-bar {
      display: flex;
      border-bottom: 2px solid var(--color-border);
      margin-bottom: 12px;
    }
    .tab-btn {
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-muted);
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color 0.15s;
    }
    .tab-btn:hover { color: var(--color-text); }
    .tab-btn.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* ── Debug pane ── */
    .debug-box {
      background: #0f172a;
      border-radius: var(--radius);
      padding: 12px;
      font-size: 11px;
      font-family: "SFMono-Regular", Consolas, monospace;
      color: #94a3b8;
      word-break: break-all;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .debug-label { color: #38bdf8; font-weight: 600; margin-bottom: 6px; display: block; }
    .debug-email { color: #4ade80; }

    /* ── Spinner ── */
    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      gap: 12px;
      color: var(--color-text-muted);
      font-size: 12px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty / error states ── */
    .state-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      color: var(--color-text-muted);
      gap: 12px;
      text-align: center;
    }
    .state-center p { font-size: 13px; }
    .section-error {
      font-size: 11px;
      color: var(--color-danger);
      padding: 6px 0;
    }

    /* ── Banners ── */
    .banner {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      border-radius: var(--radius);
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 500;
    }
    .banner-vip     { background: var(--color-gold-bg);    color: var(--color-gold);    border: 1px solid #fcd34d; }
    .banner-warning { background: var(--color-warning-bg); color: var(--color-warning); border: 1px solid #fcd34d; }
    .banner-icon { flex-shrink: 0; font-size: 14px; margin-top: 1px; }

    /* ── Card ── */
    .card {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 10px;
    }

    /* ── Contact header ── */
    .contact-header {
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .contact-name { font-size: 15px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-vip      { background: var(--color-gold-bg); color: #92400e; border: 1px solid #fcd34d; }
    .badge-standard { background: #f3f4f6; color: #374151; border: 1px solid var(--color-border); }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-pill::before {
      content: "";
      display: block;
      width: 6px; height: 6px;
      border-radius: 50%;
    }
    .pill-active    { background: var(--color-success-bg); color: var(--color-success); }
    .pill-active::before { background: var(--color-success); }
    .pill-suspended { background: var(--color-danger-bg);  color: var(--color-danger);  }
    .pill-suspended::before { background: var(--color-danger); }
    .pill-pending   { background: var(--color-warning-bg); color: var(--color-warning); }
    .pill-pending::before { background: var(--color-warning); }

    /* ── Sections ── */
    .section {
      padding: 10px 14px;
      border-bottom: 1px solid var(--color-border);
    }
    .section:last-child { border-bottom: none; }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      margin-bottom: 8px;
    }

    /* ── Detail grid ── */
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
    .detail-label { font-size: 11px; color: var(--color-text-muted); margin-bottom: 1px; }
    .detail-value { font-size: 12px; font-weight: 500; }
    .balance-frozen { color: var(--color-danger); }

    /* ── KYC pill ── */
    .kyc-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
    }
    .kyc-verified { background: var(--color-success-bg); color: var(--color-success); }
    .kyc-pending  { background: var(--color-warning-bg); color: var(--color-warning); }

    /* ── Suspension alert ── */
    .suspension-alert {
      background: var(--color-danger-bg);
      border: 1px solid #fca5a5;
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      margin-top: 8px;
    }
    .suspension-alert p { color: var(--color-danger); font-size: 12px; font-weight: 500; margin-bottom: 6px; }

    /* ── Action buttons ── */
    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-danger   { background: var(--color-danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #b91c1c; }
    .btn-warning  { background: var(--color-warning); color: #fff; }
    .btn-warning:hover:not(:disabled) { background: #b45309; }
    .btn-primary  { background: var(--color-primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #0052cc; }
    .btn-success  { background: var(--color-success); color: #fff; }
    .btn-success:hover:not(:disabled) { background: #15803d; }
    .btn-ghost {
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }
    .btn-ghost:hover:not(:disabled) { background: var(--color-border); }

    /* ── Deposit table ── */
    .deposit-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .deposit-table th {
      text-align: left;
      padding: 4px 6px 6px;
      color: var(--color-text-muted);
      font-weight: 600;
      font-size: 11px;
      border-bottom: 1px solid var(--color-border);
    }
    .deposit-table td {
      padding: 5px 6px;
      vertical-align: top;
      border-bottom: 1px solid #f3f4f6;
    }
    .deposit-table tr:last-child td { border-bottom: none; }
    .row-failed td  { background: #fff5f5; }
    .row-success td { background: #f0fdf4; }
    .status-failed  { color: var(--color-danger);  font-weight: 600; }
    .status-success { color: var(--color-success); font-weight: 600; }
    .fail-reason { font-size: 10px; color: var(--color-danger); margin-top: 2px; opacity: 0.8; }
    .bonus-tag { font-size: 10px; color: var(--color-warning); font-weight: 600; }

    /* ── Chips ── */
    .chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chips-label { font-size: 11px; color: var(--color-text-muted); width: 100%; margin-bottom: 2px; }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 14px;
      background: #eff6ff;
      color: var(--color-primary);
      border: 1px solid #bfdbfe;
      font-size: 11px;
      font-weight: 600;
    }

    /* ── Tickets ── */
    .tickets-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .tickets-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--color-primary);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .tickets-label { font-size: 12px; color: var(--color-text-muted); }

    /* ── Notes ── */
    .notes-box {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 12px;
      color: var(--color-text-muted);
    }

    /* ── Poll status ── */
    .poll-status { font-size: 11px; color: var(--color-text-muted); margin-top: 6px; }

    /* ── Send-email modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: #fff;
      border-radius: var(--radius);
      width: 290px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--color-border);
    }
    .modal-title { font-size: 13px; font-weight: 600; }
    .modal-close { background: none; border: none; cursor: pointer; color: var(--color-text-muted); font-size: 18px; line-height: 1; }
    .modal-close:hover { color: var(--color-text); }
    .modal-body { padding: 10px 14px 14px; }
    .modal-contacts-label { font-size: 11px; font-weight: 600; color: var(--color-text-muted); margin-bottom: 6px; }
    .modal-contact-list { display: flex; flex-direction: column; gap: 6px; }
    .modal-contact-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.12s, background 0.12s;
    }
    .modal-contact-btn:hover { border-color: var(--color-primary); background: #eff6ff; }
    .modal-contact-btn.loading { opacity: 0.6; pointer-events: none; }
    .modal-contact-btn.sent { border-color: var(--color-success); background: var(--color-success-bg); }
    .contact-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .contact-info-name { font-size: 12px; font-weight: 600; }
    .contact-info-sub  { font-size: 11px; color: var(--color-text-muted); }
    .contact-status-icon { margin-left: auto; font-size: 14px; }
    .modal-feedback {
      margin-top: 8px; font-size: 11px;
      padding: 5px 8px; border-radius: var(--radius-sm);
    }
    .modal-feedback.success { background: var(--color-success-bg); color: var(--color-success); }
    .modal-feedback.error   { background: var(--color-danger-bg);  color: var(--color-danger);  }
  </style>
</head>
<body>
  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('crm')">Customer 360</button>
    <button class="tab-btn" onclick="switchTab('debug')">Debug</button>
    <div style="flex:1"></div>
    <button class="btn-send-email" id="btn-send-all" style="margin:4px 0" title="Send all 3 test emails" onclick="sendAllEmails(this)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
    </button>
  </div>

  <!-- CRM tab -->
  <div id="tab-crm" class="tab-pane active">
    <div id="app">
      <div class="state-center">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
        <p>Waiting for conversation…</p>
      </div>
    </div>
  </div>

  <!-- Debug tab -->
  <div id="tab-debug" class="tab-pane">
    <div id="debug-pane" class="debug-box">Waiting for SDK update…</div>
  </div>

  <script>
    // Empty string = same origin (works on Vercel). Use "http://localhost:3000" for local dev with node server.js
    const API_BASE = "";

    // Currently loaded email
    let currentEmail = null;

    // ── Tabs ────────────────────────────────────────────────────────────────────
    function switchTab(name) {
      document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("tab-" + name).classList.add("active");
      event.currentTarget.classList.add("active");
    }

    // ── DOM helper ──────────────────────────────────────────────────────────────
    function e(tag, attrs, ...children) {
      const el = document.createElement(tag);
      if (attrs) Object.entries(attrs).forEach(([k, v]) => {
        if (k === "className") el.className = v;
        else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === "innerHTML") el.innerHTML = v;
        else if (k === "disabled") { if (v) el.disabled = true; }
        else el.setAttribute(k, v);
      });
      children.flat().forEach(c => {
        if (c == null) return;
        el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      });
      return el;
    }

    // ── API helpers ─────────────────────────────────────────────────────────────
    async function apiFetch(path, opts = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        headers: { "Content-Type": "application/json" },
        ...opts,
      });
      const json = await res.json();
      if (!res.ok) throw Object.assign(new Error(json.error || "API error"), { status: res.status });
      return json;
    }

    // ── Main load ───────────────────────────────────────────────────────────────
    async function loadContact(email) {
      currentEmail = email;
      const app = document.getElementById("app");
      app.innerHTML = "";
      app.appendChild(e("div", { className: "spinner-wrap" },
        e("div", { className: "spinner" }),
        e("span", null, "Loading…")
      ));

      let account, txData, pmData, promoData;
      const errors = {};

      await Promise.all([
        apiFetch(`/customers/${encodeURIComponent(email)}/account`)
          .then(d => { account = d; })
          .catch(err => { errors.account = err; }),
        apiFetch(`/customers/${encodeURIComponent(email)}/transactions?limit=5`)
          .then(d => { txData = d; })
          .catch(err => { errors.transactions = err; }),
        apiFetch(`/customers/${encodeURIComponent(email)}/payment-methods`)
          .then(d => { pmData = d; })
          .catch(err => { errors.paymentMethods = err; }),
        apiFetch(`/promotions/active?customer=${encodeURIComponent(email)}`)
          .then(d => { promoData = d; })
          .catch(err => { errors.promotions = err; }),
      ]);

      // If account itself failed with 404, show empty state
      if (errors.account && errors.account.status === 404) {
        renderEmpty(); return;
      }
      if (!account) {
        renderError("Failed to load account data."); return;
      }

      renderContact(email, account, txData, pmData, promoData, errors);
    }

    function renderEmpty() {
      const app = document.getElementById("app");
      app.innerHTML = "";
      app.appendChild(e("div", { className: "state-center" },
        e("svg", { width: "48", height: "48", viewBox: "0 0 24 24", fill: "none", stroke: "#d1d5db", "stroke-width": "1.5" },
          e("path", { d: "M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" }),
          e("circle", { cx: "12", cy: "7", r: "4" })
        ),
        e("p", null, "No CRM data found for this contact.")
      ));
    }

    function renderError(msg) {
      const app = document.getElementById("app");
      app.innerHTML = "";
      app.appendChild(e("div", { className: "state-center" },
        e("p", { className: "section-error" }, msg)
      ));
    }

    // ── Render ──────────────────────────────────────────────────────────────────
    function renderContact(email, account, txData, pmData, promoData, errors = {}) {
      const app = document.getElementById("app");
      app.innerHTML = "";

      const isVIP = account.tier && account.tier.toLowerCase().includes("vip");
      const isSuspended = account.account_status === "suspended";
      const transactions = (txData && txData.transactions) || [];
      const paymentMethods = pmData || { saved: [], suggested_alternatives: [] };
      const promotions = (promoData && promoData.promotions) || [];
      const activePromo = promotions.find(p => !p.applied);
      const lastTxSuccess = transactions.length > 0 && transactions[0].status === "success";

      // VIP banner
      if (isVIP) {
        app.appendChild(e("div", { className: "banner banner-vip" },
          e("span", { className: "banner-icon" }, "⭐"),
          e("span", null, "VIP Customer — assign to dedicated agent")
        ));
      }

      // Bonus expiry banner
      if (activePromo) {
        app.appendChild(e("div", { className: "banner banner-warning" },
          e("span", { className: "banner-icon" }, "⚠️"),
          e("span", null, `Bonus expiring: ${activePromo.name} — ${activePromo.value} — expires ${activePromo.expires}`)
        ));
      }

      const card = e("div", { className: "card" });

      // ── Header ──
      const statusClass = isSuspended ? "status-pill pill-suspended"
        : account.account_status === "active" ? "status-pill pill-active"
        : "status-pill pill-pending";

      card.appendChild(e("div", { className: "contact-header" },
        e("div", { className: "contact-name" }, account.name),
        e("div", { className: "header-right" },
          e("span", { className: isVIP ? "badge badge-vip" : "badge badge-standard" },
            isVIP ? `★ ${account.tier}` : account.tier
          ),
          e("span", { id: "status-pill", className: statusClass }, account.account_status)
        )
      ));

      // ── Account section ──
      const accountSection = e("div", { className: "section" },
        e("div", { className: "section-title" }, "Account"),
        e("div", { className: "detail-grid" },
          detailItem("Brand", account.brand),
          detailItem("Language", account.language),
          detailItem("Joined", account.joined),
          detailItem("Lifetime Value", account.lifetime_value),
          detailItem("Last Login", account.last_login),
          detailItem("KYC",
            e("span", { className: account.kyc_status === "verified" ? "kyc-pill kyc-verified" : "kyc-pill kyc-pending" },
              account.kyc_status === "verified" ? "✓ Verified" : "⏳ Pending"
            )
          ),
          account.account_balance
            ? detailItem("Balance", e("span", { className: "balance-frozen" }, account.account_balance))
            : null,
          account.open_tickets > 0
            ? e("div", {},
                e("div", { className: "detail-label" }, "Open Tickets"),
                e("div", { className: "tickets-row" },
                  e("span", { className: "tickets-dot" }, String(account.open_tickets)),
                  e("span", { className: "tickets-label" }, account.open_tickets === 1 ? "ticket" : "tickets")
                )
              )
            : null
        )
      );

      // Suspension alert + actions
      if (isSuspended && account.suspension_reason) {
        const pollStatus = e("div", { id: "poll-status", className: "poll-status" });
        accountSection.appendChild(e("div", { className: "suspension-alert" },
          e("p", null, `Suspended: ${account.suspension_reason}`),
          e("div", { className: "actions-row" },
            e("button", {
              className: "btn btn-danger",
              onClick: () => triggerReview(email, pollStatus),
              id: "btn-review"
            }, "↑ Trigger compliance review"),
            e("button", {
              className: "btn btn-success",
              onClick: () => liftSuspension(email),
              id: "btn-lift"
            }, "✓ Lift suspension")
          ),
          pollStatus
        ));
      }

      card.appendChild(accountSection);
      if (errors.account) {
        card.appendChild(e("div", { className: "section" },
          e("span", { className: "section-error" }, "⚠ Could not load account details")
        ));
      }

      // ── Transactions section ──
      const txSection = e("div", { className: "section", id: "tx-section" });
      txSection.appendChild(e("div", { className: "section-title" }, "Deposit History"));

      if (errors.transactions) {
        txSection.appendChild(e("div", { className: "section-error" }, "⚠ Could not load transactions"));
      } else {
        txSection.appendChild(buildTxTable(transactions));

        // Suggested payment methods
        if (paymentMethods.suggested_alternatives && paymentMethods.suggested_alternatives.length > 0) {
          txSection.appendChild(e("div", { className: "chips-row" },
            e("span", { className: "chips-label" }, "Suggested payment methods"),
            ...paymentMethods.suggested_alternatives.map(m => e("span", { className: "chip" }, m))
          ));
        }

        // Action buttons
        const txActions = e("div", { className: "actions-row", style: "margin-top:10px" });

        // Retry deposit — show if there's a failed tx and a suggested alternative
        const failedTx = transactions.find(t => t.status === "failed");
        const altMethod = paymentMethods.suggested_alternatives && paymentMethods.suggested_alternatives[0];
        if (failedTx && altMethod) {
          txActions.appendChild(e("button", {
            className: "btn btn-primary",
            id: "btn-retry",
            onClick: () => retryDeposit(email, altMethod)
          }, `↻ Retry with ${altMethod}`));
        }

        // Apply promotion — show if active promo and last tx succeeded
        if (activePromo && lastTxSuccess) {
          txActions.appendChild(e("button", {
            className: "btn btn-warning",
            id: "btn-promo",
            onClick: () => applyPromotion(email)
          }, `🎁 Apply promotion`));
        }

        if (txActions.children.length > 0) txSection.appendChild(txActions);
      }

      card.appendChild(txSection);

      // ── Notes ──
      if (account.notes) {
        card.appendChild(e("div", { className: "section" },
          e("div", { className: "section-title" }, "Agent Notes"),
          e("div", { className: "notes-box" }, account.notes)
        ));
      }

      app.appendChild(card);
    }

    function detailItem(label, value) {
      const valNode = typeof value === "string" || typeof value === "number"
        ? e("div", { className: "detail-value" }, String(value))
        : e("div", { className: "detail-value" }, value);
      return e("div", {},
        e("div", { className: "detail-label" }, label),
        valNode
      );
    }

    function buildTxTable(transactions) {
      return e("table", { className: "deposit-table" },
        e("thead", null,
          e("tr", null,
            e("th", null, "Date"),
            e("th", null, "Amount"),
            e("th", null, "Method"),
            e("th", null, "Status")
          )
        ),
        e("tbody", { id: "tx-tbody" },
          ...transactions.map(tx => buildTxRow(tx))
        )
      );
    }

    function buildTxRow(tx) {
      const amt = `€${tx.amount}`;
      return e("tr", { className: tx.status === "failed" ? "row-failed" : "row-success" },
        e("td", null, tx.date),
        e("td", null,
          amt,
          tx.bonus ? e("div", { className: "bonus-tag" }, `+${tx.bonus}`) : null
        ),
        e("td", null, tx.method),
        e("td", null,
          e("span", { className: tx.status === "failed" ? "status-failed" : "status-success" }, tx.status),
          tx.failure_reason ? e("div", { className: "fail-reason" }, tx.failure_reason) : null
        )
      );
    }

    // ── Actions ─────────────────────────────────────────────────────────────────
    async function retryDeposit(email, method) {
      const btn = document.getElementById("btn-retry");
      if (btn) { btn.disabled = true; btn.textContent = "Retrying…"; }
      try {
        const res = await apiFetch(`/customers/${encodeURIComponent(email)}/transactions/retry`, {
          method: "POST",
          body: JSON.stringify({ method }),
        });
        // Refresh tx list
        const txData = await apiFetch(`/customers/${encodeURIComponent(email)}/transactions?limit=5`);
        const tbody = document.getElementById("tx-tbody");
        if (tbody) {
          tbody.innerHTML = "";
          (txData.transactions || []).forEach(tx => tbody.appendChild(buildTxRow(tx)));
        }
        if (btn) { btn.disabled = false; btn.textContent = res.transaction.status === "success" ? "✓ Retried" : `↻ Retry with ${method}`; }
      } catch {
        if (btn) { btn.disabled = false; btn.textContent = `↻ Retry with ${method}`; }
      }
    }

    async function applyPromotion(email) {
      const btn = document.getElementById("btn-promo");
      if (btn) { btn.disabled = true; btn.textContent = "Applying…"; }
      try {
        const res = await apiFetch(`/customers/${encodeURIComponent(email)}/promotions/apply`, { method: "POST", body: "{}" });
        // Refresh tx list to show bonus tag
        const txData = await apiFetch(`/customers/${encodeURIComponent(email)}/transactions?limit=5`);
        const tbody = document.getElementById("tx-tbody");
        if (tbody) {
          tbody.innerHTML = "";
          (txData.transactions || []).forEach(tx => tbody.appendChild(buildTxRow(tx)));
        }
        if (btn) { btn.disabled = true; btn.textContent = `✓ ${res.bonus_applied} applied`; }
      } catch {
        if (btn) { btn.disabled = false; btn.textContent = "🎁 Apply promotion"; }
      }
    }

    async function triggerReview(email, pollEl) {
      const btn = document.getElementById("btn-review");
      if (btn) { btn.disabled = true; btn.textContent = "Triggering…"; }
      try {
        const res = await apiFetch(`/customers/${encodeURIComponent(email)}/account/review`, { method: "POST", body: "{}" });
        if (btn) btn.textContent = `✓ Review ${res.review_id}`;
        // Poll account status every 3s, up to 15s
        let attempts = 0;
        const maxAttempts = 5;
        if (pollEl) pollEl.textContent = "Polling for status update…";
        const interval = setInterval(async () => {
          attempts++;
          try {
            const acc = await apiFetch(`/customers/${encodeURIComponent(email)}/account`);
            const pill = document.getElementById("status-pill");
            if (pill) {
              pill.textContent = acc.account_status;
              pill.className = acc.account_status === "active" ? "status-pill pill-active"
                : acc.account_status === "suspended" ? "status-pill pill-suspended"
                : "status-pill pill-pending";
            }
            if (pollEl) pollEl.textContent = `Status: ${acc.account_status} (checked ${attempts}/${maxAttempts})`;
          } catch {}
          if (attempts >= maxAttempts) {
            clearInterval(interval);
            if (pollEl) pollEl.textContent = "Polling complete.";
          }
        }, 3000);
      } catch {
        if (btn) { btn.disabled = false; btn.textContent = "↑ Trigger compliance review"; }
      }
    }

    async function liftSuspension(email) {
      const btn = document.getElementById("btn-lift");
      if (btn) { btn.disabled = true; btn.textContent = "Lifting…"; }
      try {
        await apiFetch(`/customers/${encodeURIComponent(email)}/account`, {
          method: "PATCH",
          body: JSON.stringify({ account_status: "active" }),
        });
        // Reload the whole contact panel
        await loadContact(email);
      } catch {
        if (btn) { btn.disabled = false; btn.textContent = "✓ Lift suspension"; }
      }
    }

    // ── Send all 3 test emails ───────────────────────────────────────────────────
    const TO_ADDRESS = "support@mediapanthers.com";

    const SEED_EMAILS = [
      {
        name: "Leyton Graves",
        handle: "leyton@finalproduction.club",
        subject: "My deposit keeps failing",
        body: "Hi, I've tried to deposit €100 three times in the last hour and it keeps failing. Each time I get a generic error. I really need this sorted — I'm trying to place a bet before the match starts tonight. Please help ASAP.",
      },
      {
        name: "Sarah Connell",
        handle: "sarah@zestymedia.club",
        subject: "Deposit failed - which payment methods work?",
        body: "Hello, my deposit of €50 failed twice. I tried Visa and Mastercard. Are there other payment options I can use? I have a bonus expiring today so I really need to get this sorted quickly. Thanks, Sarah",
      },
      {
        name: "Liz Doyle",
        handle: "liz.doyle@cloudcontentconsulting.com",
        subject: "Can't log into my account",
        body: "Hi there, I've been trying to log in for the past 30 minutes and keep getting 'account suspended' error. I haven't done anything wrong and I have funds in my account. I tried resetting my password but still can't get in. Please help.",
      },
    ];

    async function sendAllEmails(btn) {
      btn.disabled = true;
      const orig = btn.innerHTML;
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>';

      await Promise.all(SEED_EMAILS.map(async contact => {
        const ts = Math.floor(Date.now() / 1000);
        const ref = String(ts + Math.floor(Math.random() * 1000));
        await fetch("/api/send-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sender: { handle: contact.handle, name: contact.name },
            to: [TO_ADDRESS],
            subject: contact.subject,
            body: contact.body,
            body_format: "html",
            type: "email",
            external_id: ref,
            created_at: ts,
            metadata: { thread_ref: ref, is_inbound: true, should_skip_rules: false, is_archived: false },
          }),
        });
      }));

      // Show tick briefly then restore
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; }, 2000);
    }

    // ── Front SDK ────────────────────────────────────────────────────────────────
    function extractEmail(conv) {
      if (!conv) return null;
      try {
        if (conv.contact && conv.contact.handle) return conv.contact.handle;
        if (conv.recipient && conv.recipient.handle) return conv.recipient.handle;
        if (conv.sender && conv.sender.handle) return conv.sender.handle;
        if (conv.contact && conv.contact.email) return conv.contact.email;
        if (Array.isArray(conv.recipients)) {
          const from = conv.recipients.find(r => r.role === "from" || r.role === "to");
          if (from && from.handle) return from.handle;
        }
      } catch (_) {}
      return null;
    }

    function render(email) {
      if (!email) { renderEmpty(); return; }
      loadContact(email);
    }

    function showDebug(label, data, email) {
      const pane = document.getElementById("debug-pane");
      if (!pane) return;
      pane.innerHTML =
        '<span class="debug-label">⚡ ' + label + '</span>' +
        '<span class="debug-email">Email: ' + (email || "none") + '</span>\n\n' +
        JSON.stringify(data, null, 2);
    }

    function handleUpdate(update) {
      if (!update || update.type === "noConversation") {
        showDebug("noConversation", update, null);
        renderEmpty(); return;
      }
      // Front SDK fires "singleConversation" or "conversation"
      if (update.type === "singleConversation" || update.type === "conversation") {
        let email = null;
        if (update.conversation && update.conversation.recipient) {
          const recipient = update.conversation.recipient;
          // For email conversations, handle is directly the email address
          if (recipient.handle && recipient.handle.includes("@")) {
            email = recipient.handle;
          }
          // For WhatsApp/SMS/phone conversations, look through the contact's handles array for an email type
          if (!email && recipient.contact && Array.isArray(recipient.contact.handles)) {
            const emailHandle = recipient.contact.handles.find(function(h) { return h.type === "email"; });
            if (emailHandle) email = emailHandle.handle;
          }
        }
        // Fallbacks
        if (!email) email = extractEmail(update);
        if (!email && update.conversation) email = extractEmail(update.conversation);
        showDebug(update.type, update, email);
        render(email); return;
      }
      showDebug("unknown type: " + update.type, update, null);
      renderEmpty();
    }

    showDebug("init — FrontPlugin = " + (typeof FrontPlugin) + ", window.Front = " + (typeof window.Front), {}, null);

    if (typeof FrontPlugin !== "undefined" && FrontPlugin.create) {
      // SDK v2 — @frontapp/plugin-sdk
      showDebug("using FrontPlugin.create()", {}, null);
      FrontPlugin.create().then(function(plugin) {
        showDebug("plugin created", {}, null);
        plugin.on("conversation", function(context) {
          handleUpdate({ type: "conversation", ...context });
        });
      }).catch(function(err) {
        showDebug("FrontPlugin.create() error: " + err.message, {}, null);
        render("leyton@finalproduction.club");
      });
    } else if (window.Front && window.Front.contextUpdates) {
      // SDK v1 observable
      showDebug("using contextUpdates", {}, null);
      window.Front.contextUpdates.subscribe(handleUpdate);
    } else if (window.Front && window.Front.on) {
      // SDK v1 callback
      showDebug("using Front.on", {}, null);
      window.Front.on("conversation", function(data) {
        handleUpdate({ type: "conversation", ...data });
      });
    } else {
      showDebug("no SDK — dev fallback", {}, "leyton@finalproduction.club");
      render("leyton@finalproduction.club");
    }
  </script>
</body>
</html>
